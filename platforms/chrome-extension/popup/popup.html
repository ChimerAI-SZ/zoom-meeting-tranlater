<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BabelAI</title>
    <style>
      body { font-family: -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 12px; }
      .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
      .status { font-size: 12px; color: #666; }
      button { padding: 6px 10px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="row">
      <button id="btnPrepare">Prepare</button>
      <button id="btnStart">Start Current Tab</button>
      <button id="btnStop">Stop</button>
      <button id="btnDemo">Demo Subtitle</button>
    </div>
    <div class="row">
      <span class="status" id="status">Idle</span>
    </div>
    <hr/>
    <div class="row">
      <label style="width:110px">API_APP_KEY</label>
      <input id="appKey" type="password" style="flex:1" placeholder="App Key"/>
    </div>
    <div class="row">
      <label style="width:110px">API_ACCESS_KEY</label>
      <input id="accessKey" type="password" style="flex:1" placeholder="Access Key"/>
    </div>
    <div class="row">
      <label style="width:110px">API_RESOURCE_ID</label>
      <input id="resourceId" type="text" style="flex:1" placeholder="volc.service_type.10053"/>
    </div>
    <div class="row">
      <label style="width:110px">Worker URL</label>
      <input id="workerURL" type="text" style="flex:1" placeholder="wss://babelai-ws.YOUR.workers.dev"/>
    </div>
    <div class="row">
      <label style="width:110px">Source Language</label>
      <select id="sourceLang" style="flex:1">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="row">
      <label style="width:110px">Target Language</label>
      <select id="targetLang" style="flex:1">
        <option value="en">English</option>
        <option value="zh">中文</option>
      </select>
    </div>
    <div class="row">
      <button id="btnSaveCfg">Save Config</button>
      <button id="btnLoadCfg">Load</button>
      <button id="btnHealth">Health</button>
    </div>
    <div class="row">
      <button id="btnCheck">Check</button>
      <button id="btnOpenGuide" title="Project docs (optional)">Guide</button>
    </div>
    <hr/>
    <h3 style="margin:8px 0">字幕配置</h3>
    <div class="row">
      <label style="width:70px">字号</label>
      <input id="subtitleFontSize" type="range" min="12" max="24" value="16" style="flex:1"/>
      <span id="fontSizeValue" style="width:40px;text-align:right">16px</span>
    </div>
    <div class="row">
      <label style="width:70px">透明度</label>
      <input id="subtitleOpacity" type="range" min="30" max="100" value="95" style="flex:1"/>
      <span id="opacityValue" style="width:40px;text-align:right">0.95</span>
    </div>
    <div class="row">
      <label style="width:70px">显示模式</label>
      <select id="displayMode" style="flex:1">
        <option value="both">双语对照</option>
        <option value="source">仅原文</option>
        <option value="translation">仅译文</option>
      </select>
    </div>
    <div class="row">
      <button id="btnSaveSubtitleConfig">保存字幕配置</button>
    </div>
    <hr/>
    <h3 style="margin:8px 0">字幕历史</h3>
    <div id="historyList" style="max-height:180px;overflow-y:auto;border:1px solid #ddd;padding:4px;border-radius:4px;font-size:12px"></div>
    <div class="row" style="margin-top:8px">
      <button id="btnRefreshHistory">刷新历史</button>
      <button id="btnClearHistory">清空历史</button>
    </div>
    <hr/>
    <h3 style="margin:8px 0">健康监控</h3>
    <div id="healthPanel" style="border:1px solid #ddd;padding:8px;border-radius:4px;font-size:12px">
      <div class="row" style="margin-bottom:4px">
        <span style="font-weight:600">状态:</span>
        <span id="healthStatus" style="margin-left:8px">未知</span>
        <span id="healthIndicator" style="margin-left:8px;width:8px;height:8px;border-radius:50%;display:inline-block"></span>
      </div>
      <div class="row" style="margin-bottom:4px">
        <span style="flex:1">运行时间: <span id="healthUptime">0s</span></span>
        <span style="flex:1">平均延迟: <span id="healthPing">0ms</span></span>
      </div>
      <div class="row" style="margin-bottom:4px">
        <span style="flex:1">音频电平: <span id="healthRMS">-∞ dB</span></span>
        <span style="flex:1">发送队列: <span id="healthQueue">0</span></span>
      </div>
      <div class="row" style="margin-bottom:4px">
        <span style="flex:1">WS事件: <span id="healthEvents">0</span></span>
        <span style="flex:1">错误次数: <span id="healthErrors">0</span></span>
      </div>
      <div class="row" style="margin-bottom:4px">
        <span style="flex:1">重连次数: <span id="healthReconnects">0</span></span>
        <span style="flex:1"></span>
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="btnHealthRefresh">刷新健康状态</button>
      <button id="btnHealthAuto">自动刷新</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
  </html>
